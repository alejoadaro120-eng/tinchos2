<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Tinchos - Base de Datos Firebase</title>
  <!-- CDN de Tailwind CSS para estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Encabezado -->
    <header class="mb-8 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-4 border-b pb-4">
      <div>
        <h1 class="text-3xl font-bold text-indigo-600">Los Tinchos</h1>
        <p class="text-gray-500 text-sm">Gestor de datos conectado a Firebase Firestore</p>
      </div>
      <div class="flex items-center gap-2 bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        Firebase Conectado
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- Formulario para agregar datos -->
      <section class="bg-white p-6 rounded-xl shadow-md md:col-span-1 border border-gray-100 h-fit">
        <h2 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">Agregar Registro</h2>
        <form id="dataForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Título / Nombre</label>
            <input type="text" id="inputTitle" required placeholder="Ej. Tarea o Elemento" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Categoría</label>
            <select id="inputCategory" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
              <option value="General">General</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Importante">Importante</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Descripción / Notas</label>
            <textarea id="inputDescription" rows="3" placeholder="Escribe detalles aquí..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </div>

          <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition-colors shadow">
            Guardar en Firebase
          </button>
        </form>
      </section>

      <!-- Lista de registros guardados -->
      <section class="bg-white p-6 rounded-xl shadow-md md:col-span-2 border border-gray-100">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
          <h2 class="text-xl font-semibold text-gray-700">Registros en Tiempo Real</h2>
          <span id="itemCount" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium">0 elementos</span>
        </div>

        <div id="recordsList" class="space-y-3">
          <!-- Mensaje de carga -->
          <div id="loading" class="text-center py-8 text-gray-400 text-sm">
            Cargando registros desde Firebase...
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- SCRIPT MODULAR DE FIREBASE -->
  <script type="module">
    // Importar librerías de Firebase desde la CDN oficial (versión 10.8.0)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc, 
      serverTimestamp, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración de tu aplicación de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDjzyD6FcjMzxNM2UiYj9TpMd1Fakk-D90",
      authDomain: "los-tinchos.firebaseapp.com",
      projectId: "los-tinchos",
      storageBucket: "los-tinchos.firebasestorage.app",
      messagingSenderId: "544073390438",
      appId: "1:544073390438:web:e0e0a27346d9770ffe90a7",
      measurementId: "G-DH4KQYYFDC"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    // Referencia a la colección en Firestore ("registros")
    const registrosRef = collection(db, "registros");

    // Elementos del DOM
    const form = document.getElementById("dataForm");
    const recordsList = document.getElementById("recordsList");
    const itemCount = document.getElementById("itemCount");

    // 1. ESCUCHAR CAMBIOS EN TIEMPO REAL (Leer datos)
    const q = query(registrosRef, orderBy("fecha", "desc"));
    
    onSnapshot(q, (snapshot) => {
      recordsList.innerHTML = "";
      itemCount.textContent = `${snapshot.docs.length} elementos`;

      if (snapshot.empty) {
        recordsList.innerHTML = `
          <div class="text-center py-8 text-gray-400 text-sm">
            No hay registros aún. Agrega uno desde el formulario.
          </div>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement("div");
        card.className = "p-4 border rounded-lg bg-gray-50 hover:bg-gray-100/50 transition-all flex justify-between items-start gap-4";

        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-gray-800">${data.titulo || "Sin título"}</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-medium">
                ${data.categoria || "General"}
              </span>
            </div>
            <p class="text-sm text-gray-600">${data.descripcion || "Sin descripción"}</p>
          </div>
          <button data-id="${id}" class="btn-delete text-red-500 hover:text-red-700 text-xs font-semibold p-1 transition-colors">
            Eliminar
          </button>
        `;

        recordsList.appendChild(card);
      });

      // Agregar eventos de eliminación a los botones
      document.querySelectorAll(".btn-delete").forEach((button) => {
        button.addEventListener("click", async (e) => {
          const docId = e.target.getAttribute("data-id");
          try {
            await deleteDoc(doc(db, "registros", docId));
          } catch (error) {
            console.error("Error al eliminar el documento: ", error);
            alert("No se pudo eliminar el registro.");
          }
        });
      });
    }, (error) => {
      console.error("Error al obtener registros: ", error);
      recordsList.innerHTML = `
        <div class="text-center py-8 text-red-500 text-sm">
          Error al conectar con la base de datos de Firebase. Verifica las reglas de Firestore.
        </div>`;
    });

    // 2. GUARDAR DATOS EN FIRESTORE
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const titulo = document.getElementById("inputTitle").value;
      const categoria = document.getElementById("inputCategory").value;
      const descripcion = document.getElementById("inputDescription").value;

      try {
        await addDoc(registrosRef, {
          titulo: titulo,
          categoria: categoria,
          descripcion: descripcion,
          fecha: serverTimestamp()
        });

        // Limpiar formulario
        form.reset();
      } catch (error) {
        console.error("Error al guardar en Firebase: ", error);
        alert("Ocurrió un error al guardar el registro.");
      }
    });
  </script>
</body>
</html>
